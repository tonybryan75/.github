# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Default CodeRabbit config — applies to all tonybryan75 repos without their own .coderabbit.yaml

language: en-US

reviews:
  profile: chill
  review_status: true
  request_changes_workflow: true

early_access: false

chat:
  auto_reply: true

tone_instructions: |
  - Be concise and technical
  - Focus on correctness, performance, and maintainability
  - Highlight potential bugs and security issues
  - Don't nitpick formatting (automated formatters handle that)
